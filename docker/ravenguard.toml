# RavenGuard edge WAF config for the wharfinger compose stack.
#
#   Client -> RavenGuard (:8080) -> status:3000
#
# TLS is expected to terminate upstream of this container (Traefik,
# Caddy, nginx, Cloudflare) or be disabled for local use. To terminate
# TLS on RavenGuard itself set tls.mode = "acme" or "files", publish
# 80/443, and keep trust.mode = "edge".

[listen]
http = ":8080"

[tls]
mode = "off"
# [tls.acme]
# email = "admin@example.com"
# agree_tos = true
# staging = true
# storage_dir = "/data/certs"
# hosts = ["status.example.com"]

[upstream]
url = "http://status:3000"
connect_timeout = "5s"
response_header_timeout = "30s"
idle_conn_timeout = "90s"

[upstream.health]
enabled = true
path = "/healthz"
interval = "10s"
timeout = "3s"

[trust]
# This stack publishes RavenGuard directly, so the TCP peer is the
# client. If another proxy terminates TLS in front of this container,
# switch to behind_proxy and copy the trust block from
# ravenguard.coolify.toml (RavenGuard refuses to start in behind_proxy
# mode without an explicit trusted_proxies list).
mode = "edge"
proxy_protocol = false

[blocklists]
ip_files = ["/blocklists/ips.txt"]
dns_files = ["/blocklists/domains.txt"]
ua_files = ["/blocklists/ua.txt"]
reload_interval = "30s"

[allowlists]
# Trusted fetchers that skip detect scoring and challenge. Add uptime
# checkers, GitHub Camo IPs (for /badge/ embeds), and your own egress
# IPs here. They remain subject to blocklists and rate limits.
ip_files = ["/allowlists/ips.txt"]
ua_files = ["/allowlists/ua.txt"]
reload_interval = "30s"

[ratelimit]
enabled = true
requests = 120
window = "1m"
burst = 60
challenge_over = true
subnet_requests = 1000
subnet_burst = 200
subnet_window = "1m"

[protect]
enabled = true
max_body_bytes = 1048576
max_header_bytes = 16384
max_url_bytes = 8192
ban_after_strikes = 5
ban_ttl = "10m"
attack_block = true
attack_score = 90
write_method_cost = 3

# Adaptive bot/scraper detection. challenge_score is the threshold for
# the JS proof-of-work challenge; block_score hard-denies. Tuning these
# is the main anti-bot control surface.
[detect]
enabled = true
challenge_score = 40
block_score = 90
high_404_threshold = 20
high_404_window = "1m"
high_404_action = "challenge"
penalty_threshold = 100
penalty_window = "1m"
penalty_action = "challenge"
cache_miss_ttl = "5s"

[challenge]
enabled = true
mode = "detect"
algorithm = "adaptive"
difficulty = 16
cookie_name = "rg_clear"
cookie_ttl = "24h"
# The secret comes from RG_CHALLENGE_SECRET (required by compose,
# min 16 chars). Do not commit a real value here.
path_prefix = "/_rg"

[challenge.captcha]
enabled = false

[privacy]
hash_client_ip = true
log_ip = "hash"
retention = "30m"
waf_events_ttl = "24h"

[ui]
brand = "RavenGuard"
status_text = "Checking your browser before accessing this site."
test_mode = false

[site]
robots = "noindex, nofollow"
lang = "en"

[logging]
level = "info"
format = "text"
stats = true
stats_interval = "30s"

[sandbox]
mode = "best_effort"

[sandbox.landlock]
restrict_net = true
restrict_scoped = true
ignore_missing = true

[sandbox.seccomp]
deny_action = "errno"

# The status app has its own admin panel; RavenGuard's control plane
# stays off. Enable it only for fleet (hub/proxy) installs.
[admin]
enabled = false
