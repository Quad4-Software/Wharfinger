name: release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  agent-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    container: golang:1.26.6-alpine3.23
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build agent
        working-directory: agent
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/Quad4-Software/Wharfinger/agent/internal/collect.AgentVersion=${{ github.ref_name }}" \
            -o "/tmp/wharfinger-agent-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/wharfinger-agent

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: /tmp/wharfinger-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: agent-binaries
    permissions:
      contents: write # gh release create
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          cp ../agent/install.sh .
          cp ../agent/systemd/wharfinger-agent.service .
          cp ../agent/openrc/wharfinger-agent ./wharfinger-agent.openrc
          sha256sum wharfinger-agent-* wharfinger-agent.openrc wharfinger-agent.service install.sh \
            > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            wharfinger-agent-* wharfinger-agent.openrc wharfinger-agent.service install.sh \
            SHA256SUMS.txt
