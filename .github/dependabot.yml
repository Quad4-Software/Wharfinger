version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # typescript 7 is the tsgo native compiler; it ships via
      # @typescript/native and breaks typescript-eslint/svelte-check.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
