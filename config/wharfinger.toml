# Host metrics ingest for the Go agent (agent/). Register systems in
# the panel under Systems; each gets a one-time bearer token. Agents
# push JSON to POST /ingress, or keep a websocket open at /ingress/ws
# (production server only) using the Beszel-style handshake: token ->
# hub ed25519 signature -> machine fingerprint bind. GET /ingress/pubkey
# exposes the hub public key for the agent KEY env var.
# [ingress]
# enabled = true
# max_body_kb = 512          # payload size cap
# sample_retention_days = 30 # graph history retention
# online_seconds = 90        # last-seen window that counts as online
# # Agent alerts route through [notifications] targets as
# # down/degraded/recovered events; 0 disables each rule.
# alert_offline_minutes = 10 # silent agent fires down, reporting fires recovered
# alert_cpu_pct = 0          # e.g. 90: degraded at >=90, recovers below 80
# alert_mem_pct = 0
# alert_disk_pct = 0         # worst disk usage across mounts

# OIDC sign-in for the panel (Pocket ID, Authelia, Authentik, Keycloak,
# any spec-compliant provider with discovery + userinfo). Create an
# OIDC client with redirect URI https://<host><admin.base_path>/api/auth/oidc/callback.
# Roles come from group claims: admin_group/operator_group map members,
# everyone else falls back to default_role ("deny" rejects the login;
# any other value must name a role in the roles table).
# External users are provisioned on first login (source = oidc) and
# never get a local password.
# [oidc]
# enabled = true
# issuer = "https://auth.quad4.io"
# client_id = "status"
# client_secret = "${OIDC_CLIENT_SECRET}"
# scopes = "openid profile email groups"
# button_label = "Sign in with Pocket ID"
# admin_group = "status-admins"
# operator_group = "status-viewers"
# default_role = "deny"            # any role name, or "deny"
# sync_profile = true              # refresh name+role on every login

# LDAP password auth for the panel (OpenLDAP, Active Directory, lldap).
# Direct bind verifies the password; the optional service-account
# search resolves display name and memberOf groups for role mapping.
# [ldap]
# enabled = true
# url = "ldaps://ldap.example.com:636"   # or ldap:// + starttls = true
# starttls = false
# bind_dn = "uid={username},ou=people,dc=example,dc=com"
# search_bind_dn = "uid=status-ro,ou=service,dc=example,dc=com"
# search_bind_password = "${LDAP_BIND_PASSWORD}"
# search_base = "ou=people,dc=example,dc=com"
# user_filter = "(uid={username})"
# display_attr = "cn"
# admin_group = "cn=status-admins,ou=groups,dc=example,dc=com"
# operator_group = "cn=status-viewers,ou=groups,dc=example,dc=com"
# default_role = "deny"            # any role name, or "deny"
# timeout_ms = 8000

# Error telemetry over the Sentry event protocol. One dsn works with
# Sentry, GlitchTip, and Bugsink; all three accept the same envelope
# endpoint. Unexpected server errors are reported with an errorId that
# also appears on the error page; browser crashes from the error
# boundary and client error hook relay through POST /api/telemetry so
# the dsn never reaches the page. Set enabled = false or dsn = "" to
# turn reporting off. Reported URLs are stripped of query strings.
# Disabled by default: set enabled = true to opt in, and point dsn at
# your own Sentry/GlitchTip/Bugsink project.
[telemetry]
enabled = false
dsn = "https://e4312b8cd18c427c803fb19041285df8@bugs.quad4.io/4"
environment = "production"
client_reports = true   # forward browser crashes
max_per_minute = 60     # event cap; duplicates always collapse
